<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SallCraft - Mods, Texturas, Addons e Launchers</title>
    <!-- Fonte Inter Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==================== VARIÁVEIS E BASE ==================== */
        :root {
            --bg-black: #09090b;
            --bg-card: #121217;
            --bg-card-hover: #1c1c24;
            --bg-input: #181820;
            --purple-main: #8b5cf6;
            --purple-hover: #7c3aed;
            --purple-glow: rgba(139, 92, 246, 0.25);
            --text-white: #ffffff;
            --text-gray: #a1a1aa;
            --text-muted: #71717a;
            --border-color: #27272a;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            font-family: inherit;
        }

        /* ==================== CABEÇALHO (HEADER) ==================== */
        header {
            background-color: rgba(18, 18, 23, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            padding: 0.8rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo-img {
            height: 42px;
            width: auto;
            border-radius: 6px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--text-white);
        }

        .logo-text span {
            color: var(--purple-main);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .lang-select {
            background-color: var(--bg-input);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.8rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .lang-select:hover {
            border-color: var(--purple-main);
        }

        .btn-support {
            background-color: rgba(139, 92, 246, 0.1);
            color: var(--purple-main);
            border: 1px solid var(--purple-main);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .btn-support:hover {
            background-color: var(--purple-main);
            color: var(--text-white);
            box-shadow: 0 0 15px var(--purple-glow);
        }

        /* ==================== HERO SECTION ==================== */
        .hero {
            text-align: center;
            padding: 3.5rem 1.5rem 2rem 1.5rem;
            background: radial-gradient(circle at top, rgba(139, 92, 246, 0.15) 0%, rgba(9, 9, 11, 0) 70%);
            border-bottom: 1px solid var(--border-color);
        }

        .hero-logo-container {
            margin-bottom: 1rem;
        }

        .hero-logo {
            max-width: 140px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
        }

        .hero p {
            color: var(--text-gray);
            font-size: 1rem;
            max-width: 680px;
            margin: 0 auto 1.5rem auto;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .social-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .social-btn:hover {
            border-color: var(--purple-main);
            transform: translateY(-2px);
            color: var(--purple-main);
        }

        /* ==================== BARRA DE EDIÇÕES E NAVEGAÇÃO ==================== */
        .main-nav-container {
            max-width: 1300px;
            margin: 2rem auto 0 auto;
            padding: 0 5%;
        }

        .edition-tabs {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            background-color: var(--bg-card);
            color: var(--text-gray);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--text-white);
            border-color: var(--purple-main);
        }

        .tab-btn.active {
            background-color: var(--purple-main);
            color: var(--text-white);
            border-color: var(--purple-main);
            box-shadow: 0 4px 20px var(--purple-glow);
        }

        /* ==================== BARRAS DE CONTROLE (BUSCA, CATEGORIAS E ORDENAÇÃO) ==================== */
        .controls-bar {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-sort-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 260px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            border-radius: var(--radius-sm);
            color: var(--text-white);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--purple-main);
        }

        .sort-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sort-select {
            background-color: var(--bg-input);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .categories-row {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }

        .cat-btn {
            background-color: var(--bg-input);
            color: var(--text-gray);
            border: 1px solid var(--border-color);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-btn:hover, .cat-btn.active {
            border-color: var(--purple-main);
            color: var(--text-white);
            background-color: rgba(139, 92, 246, 0.15);
        }

        /* ==================== CONTAINER DE CONTEÚDO E GRID ==================== */
        .content-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 5% 4rem 5%;
            flex: 1;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.8rem;
        }

        /* ==================== CARD DE MOD/TEXTURA (STYLE CURSEFORGE/MCPEDL) ==================== */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--purple-main);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--purple-glow);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 190px;
            background-color: #1a1a22;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .card:hover .card-img {
            transform: scale(1.04);
        }

        .card-bookmark-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(9, 9, 11, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            color: var(--text-gray);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
            z-index: 2;
        }

        .card-bookmark-btn:hover, .card-bookmark-btn.saved {
            color: #ef4444;
            background-color: rgba(9, 9, 11, 0.9);
            border-color: #ef4444;
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 0.6rem;
            color: var(--text-white);
            line-height: 1.3;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            font-size: 0.8rem;
        }

        .card-version-badge {
            background-color: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: 700;
        }

        .card-downloads {
            color: var(--text-gray);
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        /* Botões de Ação do Card (4 Botões) */
        .card-actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-top: auto;
        }

        .btn-action {
            padding: 0.6rem 0.4rem;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 700;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-dl-primary {
            background-color: var(--purple-main);
            color: var(--text-white);
            grid-column: span 1;
        }

        .btn-dl-primary:hover {
            background-color: var(--purple-hover);
            box-shadow: 0 0 10px var(--purple-glow);
        }

        .btn-dl-secondary {
            background-color: var(--bg-input);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            grid-column: span 1;
        }

        .btn-dl-secondary:hover {
            border-color: var(--text-gray);
            background-color: #22222d;
        }

        .btn-tut-install {
            background-color: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            grid-column: span 1;
        }

        .btn-tut-install:hover {
            background-color: rgba(16, 185, 129, 0.25);
        }

        .btn-tut-bypass {
            background-color: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            grid-column: span 1;
        }

        .btn-tut-bypass:hover {
            background-color: rgba(245, 158, 11, 0.25);
        }

        /* Status Vazio */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            grid-column: 1 / -1;
            color: var(--text-gray);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        /* ==================== RODAPÉ (FOOTER) ==================== */
        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 2.5rem 5% 1.5rem 5%;
            margin-top: auto;
        }

        .footer-content {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .footer-brand p {
            color: var(--text-gray);
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }

        .footer-copy {
            max-width: 1300px;
            margin: 1.5rem auto 0 auto;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 0.8rem;
            }
            .hero h1 { font-size: 1.8rem; }
            .edition-tabs { flex-direction: flex; flex-wrap: wrap; }
            .tab-btn { flex: 1 1 40%; justify-content: center; font-size: 0.85rem; }
            .card-actions-grid { grid-template-columns: 1fr; }
            .btn-action { grid-column: span 1 !important; }
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="header-brand">
            <!-- Caso tenha um arquivo de logo (ex: logo.png), insira aqui -->
            <a href="#" onclick="switchTab('bedrock')" class="logo-text">Sall<span>Craft</span></a>
        </div>
        <div class="nav-actions">
            <select class="lang-select" id="langSwitcher" onchange="changeLanguage()">
                <option value="pt">🇵🇹 Português</option>
                <option value="en">🇺🇸 English</option>
                <option value="es">🇪🇸 Español</option>
            </select>
            <a href="mailto:sallmccount@gmail.com" class="btn-support">
                <i class="fa-solid fa-envelope"></i>
                <span data-i18n="support">Suporte</span>
            </a>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-logo-container">
            <!-- Insira sua foto de logo aqui se desejar -->
            <!-- <img src="SUA_LOGO.png" alt="SallCraft Logo" class="hero-logo"> -->
        </div>
        <h1 data-i18n="hero_title">SallCraft</h1>
        <p data-i18n="hero_desc">Bem vindo ao site SallCraft, aqui você irá encontrar texturas, mods e muito mais para seu Minecraft Bedrock e Java.</p>
        
        <!-- REDES SOCIAIS -->
        <div class="social-links">
            <a href="https://tiktok.com/@sall.skkkkk" target="_blank" rel="noopener" class="social-btn">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>
            <a href="https://youtube.com/@sallkng?si=FRe6uNwS9JgJo" target="_blank" rel="noopener" class="social-btn">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>
            <a href="https://discord.gg/FmkywjTpzF" target="_blank" rel="noopener" class="social-btn">
                <i class="fa-brands fa-discord"></i> Discord
            </a>
        </div>
    </section>

    <!-- NAVEGAÇÃO PRINCIPAL (EDITIONS & CLIENTS) -->
    <div class="main-nav-container">
        <div class="edition-tabs">
            <button class="tab-btn active" id="tab-bedrock" onclick="switchTab('bedrock')">
                <i class="fa-solid fa-cube"></i> Minecraft Bedrock
            </button>
            <button class="tab-btn" id="tab-java" onclick="switchTab('java')">
                <i class="fa-solid fa-mug-hot"></i> Minecraft Java
            </button>
            <button class="tab-btn" id="tab-client-bedrock" onclick="switchTab('client-bedrock')">
                <i class="fa-solid fa-gamepad"></i> Client Bedrock
            </button>
            <button class="tab-btn" id="tab-launcher-java" onclick="switchTab('launcher-java')">
                <i class="fa-solid fa-rocket"></i> Launcher Java
            </button>
            <button class="tab-btn" id="tab-saved" onclick="switchTab('saved')">
                <i class="fa-solid fa-heart"></i> <span data-i18n="tab_saved">Salvos</span>
            </button>
        </div>

        <!-- CONTROLES (BUSCA, CATEGORIAS, ORDENAÇÃO) -->
        <div class="controls-bar" id="controlsBar">
            <div class="search-sort-row">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar..." oninput="filterAndRender()">
                </div>
                <div class="sort-box">
                    <i class="fa-solid fa-sort" style="color: var(--text-gray);"></i>
                    <select id="sortSelect" class="sort-select"
